# SPDX-License-Identifier: MIT
# Trusted-code library integration. Never substitute pull_request_target,
# an unreviewed PR checkout or event/JSON-selected module paths.
name: Customer handler rehearsal example
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: rehearsal
        shell: bash
        env:
          WHR_SCENARIO_PATH: fixtures/rehearsal.json
          WHR_OUTPUT_DIR: rehearsal-output/customer
          WHR_ADAPTER: custom
        run: node examples/customer-action.mjs
      # The fixed, reviewed script imports customerAdapter directly and invokes
      # the same runAction reporting/exit machinery as action.yml.
      # No secrets, uploads, comments, automatic commits or continue-on-error.
